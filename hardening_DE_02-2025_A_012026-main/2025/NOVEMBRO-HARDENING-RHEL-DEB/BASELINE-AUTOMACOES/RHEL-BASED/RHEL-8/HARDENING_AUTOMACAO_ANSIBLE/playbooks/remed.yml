---
- name: Executar scripts de remediacao HITSS
  hosts: all
  become: yes
  roles:
    - role: remediation
  post_tasks:
    - name: Registrar execução da remediacao HITSS v1.0.0
      ansible.builtin.lineinfile:
        path: /var/log/hitss-hardening.log
        line: "{{ ansible_date_time.iso8601 }} - REMEDIATION - v1.0.0 - host: {{ inventory_hostname }} - tags: {{ ansible_run_tags | join(',') }}"
        create: yes
        owner: root
        group: root
        mode: '0600'
        insertafter: EOF
      tags: always
      ignore_errors: yes
