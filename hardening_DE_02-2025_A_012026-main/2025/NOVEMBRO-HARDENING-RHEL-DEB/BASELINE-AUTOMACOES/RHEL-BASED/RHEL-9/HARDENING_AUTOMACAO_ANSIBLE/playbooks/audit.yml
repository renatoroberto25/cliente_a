---
- name: Executar scripts de auditoria HITSS
  hosts: all
  become: yes

  roles:
    - role: audit
      tags: audit

  post_tasks:
    - name: Registrar execução da auditoria HITSS v1.1.0
      ansible.builtin.lineinfile:
        path: /var/log/hitss-hardening.log
        line: "{{ ansible_date_time.iso8601 }} - AUDIT - v1.1.0 - host: {{ inventory_hostname }} - tags: {{ ansible_run_tags | join(',') }}"
        create: yes
        owner: root
        group: root
        mode: '0600'
        insertafter: EOF
      tags: always