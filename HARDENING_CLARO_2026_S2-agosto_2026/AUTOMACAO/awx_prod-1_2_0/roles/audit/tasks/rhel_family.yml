    if grep -Eq '^[[:space:]]*Storage=persistent\b' /etc/systemd/journald.conf 2>/dev/null; then
      echo "1"
    else
      echo "0"
    fi
  register: rhel_162
  changed_when: false
  failed_when: false

- name: Verificar arquitetura logs (161)
  shell: |
    if systemctl is-enabled rsyslog 2>/dev/null | grep -qx enabled; then
      if grep -Eq '^[[:space:]]*ForwardToSyslog=yes' /etc/systemd/journald.conf 2>/dev/null; then
        echo "1"
      else
        if grep -Eq '^[[:space:]]*Storage=persistent' /etc/systemd/journald.conf 2>/dev/null; then
          echo "1"
        else
          echo "0"
        fi
      fi
    else
      if grep -Eq '^[[:space:]]*Storage=persistent' /etc/systemd/journald.conf 2>/dev/null; then
        echo "1"
      else
        echo "0"
      fi
    fi
  register: rhel_161
  changed_when: false
  failed_when: false

