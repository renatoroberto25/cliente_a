- name: Verificar AIDE instalado e inicializado (182)
  shell: |
    if rpm -q aide >/dev/null 2>&1; then
      if [ -f /var/lib/aide/aide.db.gz ]; then
        echo "1"
      else
        if [ -f /var/lib/aide/aide.db.new.gz ]; then
          echo "1"
        else
          echo "0"
        fi
      fi
    else
      echo "0"
    fi
  register: rhel_182
  changed_when: false
  failed_when: false

- name: Verificar verificação integridade (183)
  shell: |
    if grep -REq '\baide\b' /etc/cron.* /etc/crontab /var/spool/cron 2>/dev/null; then
      echo "1"
    else
      if systemctl is-enabled aidecheck.service >/dev/null 2>&1; then
        echo "1"
      else
        if systemctl is-enabled aidecheck.timer >/dev/null 2>&1; then
          echo "1"
        else
          echo "0"
        fi
      fi
    fi
  register: rhel_183
  changed_when: false
  failed_when: false

- name: Verificar proteção dos binários de auditoria (184)
  shell: |
    if [ -e /sbin/auditctl ]; then
      if [ -e /sbin/aureport ]; then
        if [ -e /sbin/ausearch ]; then
          if [ -e /sbin/autrace ]; then
            if [ -e /sbin/auditd ]; then
              if [ -e /sbin/augenrules ]; then
                if stat -Lc "%a %U %G" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules 2>/dev/null | awk '{if($1+0>750 || $2!="root" || $3!="root") exit 1} END{exit 0}'; then
                  echo "1"
                else
                  echo "0"
                fi
              else
                echo "0"
              fi
            else
              echo "0"
            fi
          else
            echo "0"
          fi
        else
          echo "0"
        fi
      else
        echo "0"
      fi
    else
      echo "0"
    fi
  register: rhel_184
  changed_when: false
  failed_when: false

