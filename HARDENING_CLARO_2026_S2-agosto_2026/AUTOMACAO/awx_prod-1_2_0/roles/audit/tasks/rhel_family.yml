# roles/audit/tasks/rhel_family.yml
- name: Carregar regras RHEL family
  ansible.builtin.include_vars:
    file: "{{ role_path }}/rules/rhel_family.yml"

# ===== Bootloader (RHEL-like) =====
- name: Verificar bootloader RHEL-like
  block:
    - name: Senha grub
      command: grep -E '^password_pbkdf2' /boot/grub2/grub.cfg
      register: bl_49
      failed_when: false
      changed_when: false

    - name: Permissões grub.cfg
      ansible.builtin.stat:
        path: /boot/grub2/grub.cfg
      register: bl_50
      changed_when: false
      failed_when: false

    - name: Single user
      command: grep -E 'SYSTEMD_SULOGIN|sulogin' /etc/sysconfig/init
      register: bl_51
      failed_when: false
      changed_when: false

- name: Resultado bootloader (RHEL)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][{{ item.id }}]
      {{ 'APROVADO' if item.ok else 'REPROVADO' }}
  loop:
    - { id: 49, ok: "{{ bl_49.rc | default(1) == 0 }}", descricao: "Senha de bootloader configurada" }
    - { id: 50, ok: "{{ (bl_50.stat.exists | default(false)) and (bl_50.stat.pw_name | default('')) == 'root' and (bl_50.stat.mode | default('')) == '0600' }}", descricao: "Permissões seguras no arquivo do bootloader" }
    - { id: 51, ok: "{{ bl_51.rc | default(1) == 0 }}", descricao: "Single user mode com autenticação" }
  loop_control:
    label: "{{ item.id }} - {{ item.descricao }}"

# ===== 58 – Time sync ativo =====
- name: Verificar time sync ativo aprovado (RHEL)
  shell: |
    ACTIVE=""
    if systemctl is-active chronyd >/dev/null 2>&1; then
      ACTIVE="chronyd"
    else
      if systemctl is-active ntpd >/dev/null 2>&1; then
        ACTIVE="ntpd"
      else
        if systemctl is-active systemd-timesyncd >/dev/null 2>&1; then
          ACTIVE="systemd-timesyncd"
        else
          ACTIVE=""
        fi
      fi
    fi
    echo "$ACTIVE"
  register: rhel_timesync_active
  changed_when: false
  failed_when: false

- name: Resultado time sync ativo (58)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][58]
      {{ 'APROVADO' if rhel_timesync_active.stdout | trim != '' else 'REPROVADO' }}

# ===== 59 – Fontes NTP confiáveis =====
- name: Verificar fontes NTP confiáveis com chrony (RHEL)
  shell: |
    if [ -f /etc/chrony.conf ]; then
      grep -E '^(server|pool)[[:space:]]+' /etc/chrony.conf
    else
      echo ""
    fi
  register: rhel_timesync_sources_chrony
  changed_when: false
  failed_when: false

- name: Verificar fontes NTP confiáveis com ntp (RHEL)
  shell: |
    if [ -f /etc/ntp.conf ]; then
      grep -E '^(server|pool)[[:space:]]+' /etc/ntp.conf
    else
      echo ""
    fi
  register: rhel_timesync_sources_ntp
  changed_when: false
  failed_when: false

- name: Verificar fontes NTP confiáveis com systemd-timesyncd (RHEL)
  shell: |
    if [ -f /etc/systemd/timesyncd.conf ]; then
      grep -E '^[[:space:]]*NTP=' /etc/systemd/timesyncd.conf
    else
      echo ""
    fi
  register: rhel_timesync_sources_timesyncd
  changed_when: false
  failed_when: false

- name: Verificar time sync habilitado no boot (RHEL)
  shell: |
    ENABLED=0
    if systemctl is-enabled chronyd >/dev/null 2>&1; then
      ENABLED=1
    else
      if systemctl is-enabled ntpd >/dev/null 2>&1; then
        ENABLED=1
      else
        if systemctl is-enabled systemd-timesyncd >/dev/null 2>&1; then
          ENABLED=1
        else
          ENABLED=0
        fi
      fi
    fi
    echo "$ENABLED"
  register: rhel_timesync_boot
  changed_when: false
  failed_when: false

- name: Verificar polkit ativo (RHEL)
  command: systemctl is-enabled polkit
  register: rhel_polkit
  changed_when: false
  failed_when: false

- name: Resultado polkit seguro (86)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][86]
      {{ 'APROVADO' if rhel_polkit.stdout in ['enabled', 'static'] else 'REPROVADO' }}

# ===== 87 – gpgcheck ativo =====
- name: Verificar gpgcheck ativo (RHEL)
  command: grep -R '^[^#].*gpgcheck=1' /etc/yum.repos.d
  register: rhel_gpgcheck
  changed_when: false
  failed_when: false

- name: Resultado gpgcheck ativo (87)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][87]
      {{ 'APROVADO' if rhel_gpgcheck.rc == 0 else 'REPROVADO' }}

# ===== 88 – Patches aplicados =====
- name: Verificar patches pendentes (RHEL)
  command: yum check-update
  register: rhel_patches
  changed_when: false
  failed_when: false

- name: Resultado patches aplicados (88)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][88]
      {{ 'APROVADO' if rhel_patches.rc != 100 else 'REPROVADO' }}

# ===== 89 – Time sync único =====
- name: Verificar time sync único (RHEL)
  shell: |
    ACTIVE=0
    systemctl is-active chronyd >/dev/null 2>&1 && ACTIVE=$((ACTIVE+1))
    systemctl is-active ntpd >/dev/null 2>&1 && ACTIVE=$((ACTIVE+1))
    systemctl is-active systemd-timesyncd >/dev/null 2>&1 && ACTIVE=$((ACTIVE+1))
    echo "$ACTIVE"
  register: rhel_timesync_unique
  changed_when: false
  failed_when: false

- name: Resultado time sync único (89)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][89]
      {{ 'APROVADO' if rhel_timesync_unique.stdout | trim == '1' else 'REPROVADO' }}
# ===== 108-129 – SSH =====
- name: Verificar SSH - parametros efetivos (RHEL)
  command: sshd -T
  register: rhel_ssh_effective
  changed_when: false
  failed_when: false

- name: Verificar SSH - diretório /etc/ssh (RHEL)
  ansible.builtin.stat:
    path: /etc/ssh
  register: rhel_ssh_dir
  changed_when: false
  failed_when: false

- name: Verificar SSH - arquivo sshd_config (RHEL)
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: rhel_ssh_cfg
  changed_when: false
  failed_when: false

- name: Verificar SSH - Allow Deny (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^(allowusers|allowgroups|denyusers|denygroups)[[:space:]]+'; then
      echo "1"
    else
      echo "0"
    fi
  register: rhel_ssh_110
  changed_when: false
  failed_when: false

- name: Verificar SSH - MaxAuthTries (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^maxauthtries[[:space:]]+([1-4])$'; then
      echo "1"
    else
      echo "0"
    fi
  register: rhel_ssh_113
  changed_when: false
  failed_when: false

- name: Verificar SSH - ClientAlive tunado (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^clientaliveinterval[[:space:]]+(300|600|900)$'; then
      if sshd -T 2>/dev/null | grep -Eiq '^clientalivecountmax[[:space:]]+[0-3]$'; then
        echo "1"
      else
        echo "0"
      fi
    else
      echo "0"
    fi
  register: rhel_ssh_120
  changed_when: false
  failed_when: false

- name: Verificar SSH - LoginGraceTime restrito (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^logingracetime[[:space:]]+(30|60)$'; then
      echo "1"
    else
      echo "0"
    fi
  register: rhel_ssh_121
  changed_when: false
  failed_when: false

- name: Verificar SSH - MaxStartups restrito (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^maxstartups[[:space:]]+10:30:60$'; then
      echo "1"
    else
      if sshd -T 2>/dev/null | grep -Eiq '^maxstartups[[:space:]]+10$'; then
        echo "1"
      else
        echo "0"
      fi
    fi
  register: rhel_ssh_122
  changed_when: false
  failed_when: false

- name: Verificar SSH - banner configurado (RHEL)
  shell: |
    BANNER_FILE="$(sshd -T 2>/dev/null | awk '/^banner / {print $2}')"
    if [ -n "$BANNER_FILE" ]; then
      if [ "$BANNER_FILE" != "none" ]; then
        if [ -s "$BANNER_FILE" ]; then
          echo "1"
        else
          echo "0"
        fi
      else
        echo "0"
      fi
    else
      echo "0"
    fi
  register: rhel_ssh_banner
  changed_when: false
  failed_when: false

- name: Verificar SSH - Ciphers fortes apenas (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^ciphers[[:space:]]+'; then
      if sshd -T 2>/dev/null | grep -Eiq '(cbc|3des|arcfour)'; then
        echo "0"
      else
        echo "1"
      fi
    else
      echo "0"
    fi
  register: rhel_ssh_125
  changed_when: false
  failed_when: false

- name: Verificar SSH - MACs fortes apenas (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^macs[[:space:]]+'; then
      if sshd -T 2>/dev/null | grep -Eiq '(hmac-md5|hmac-sha1|umac-64)'; then
        echo "0"
      else
        echo "1"
      fi
    else
      echo "0"
    fi
  register: rhel_ssh_126
  changed_when: false
  failed_when: false

- name: Verificar SSH - KexAlgorithms fortes apenas (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq '^kexalgorithms[[:space:]]+'; then
      if sshd -T 2>/dev/null | grep -Eiq '(diffie-hellman-group1-sha1|diffie-hellman-group14-sha1|diffie-hellman-group-exchange-sha1)'; then
        echo "0"
      else
        echo "1"
      fi
    else
      echo "0"
    fi
  register: rhel_ssh_127
  changed_when: false
  failed_when: false

- name: Verificar SSH - Preferencia por algoritmos modernos (RHEL)
  shell: |
    if sshd -T 2>/dev/null | grep -Eiq 'ciphers[[:space:]]+.*chacha20-poly1305@openssh.com'; then
      echo "1"
    else
      if sshd -T 2>/dev/null | grep -Eiq 'kexalgorithms[[:space:]]+.*sntrup761x25519-sha512@openssh.com'; then
        echo "1"
      else
        if sshd -T 2>/dev/null | grep -Eiq 'kexalgorithms[[:space:]]+.*curve25519-sha256'; then
          echo "1"
        else
          echo "0"
        fi
      fi
    fi
  register: rhel_ssh_128
  changed_when: false
  failed_when: false

- name: Verificar SSH - ForceCommand/Chroot (RHEL)
  shell: |
    if grep -Eiq '^[[:space:]]*Match[[:space:]]+' /etc/ssh/sshd_config 2>/dev/null; then
      if grep -Eiq '^[[:space:]]*ChrootDirectory[[:space:]]+' /etc/ssh/sshd_config 2>/dev/null; then
        if grep -Eiq '^[[:space:]]*ForceCommand[[:space:]]+' /etc/ssh/sshd_config 2>/dev/null; then
          echo "1"
        else
          echo "0"
        fi
      else
        echo "0"
      fi
    else
      echo "0"
    fi
  register: rhel_ssh_forcecommand
  changed_when: false
  failed_when: false

- name: Resultado SSH (RHEL)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][{{ item.id }}]
      {{ 'APROVADO' if item.ok else 'REPROVADO' }}
  loop:
    - { id: 108, ok: "{{ rhel_ssh_effective.rc | default(1) == 0 and 'protocol 2' in (rhel_ssh_effective.stdout | lower) }}", descricao: "TLS minimo 1.2 1.3" }
    - { id: 109, ok: "{{ (rhel_ssh_dir.stat.exists | default(false)) and (rhel_ssh_dir.stat.pw_name | default('')) == 'root' and (rhel_ssh_dir.stat.gr_name | default('')) == 'root' and (rhel_ssh_cfg.stat.exists | default(false)) and (rhel_ssh_cfg.stat.pw_name | default('')) == 'root' and (rhel_ssh_cfg.stat.gr_name | default('')) == 'root' and (rhel_ssh_cfg.stat.mode | default('')) in ['0600', '0640'] }}", descricao: "Permissões SSH seguras" }
    - { id: 110, ok: "{{ (rhel_ssh_110.stdout | trim) == '1' }}", descricao: "Controle de acesso via Allow Deny" }
    - { id: 111, ok: "{{ 'syslogfacility authpriv' in (rhel_ssh_effective.stdout | lower) }}", descricao: "SyslogFacility AUTHPRIV" }
    - { id: 112, ok: "{{ 'x11forwarding no' in (rhel_ssh_effective.stdout | lower) }}", descricao: "X11Forwarding off" }
    - { id: 113, ok: "{{ (rhel_ssh_113.stdout | trim) == '1' }}", descricao: "MaxAuthTries restrito" }
    - { id: 114, ok: "{{ 'ignorerhosts yes' in (rhel_ssh_effective.stdout | lower) }}", descricao: "IgnoreRhosts yes" }
    - { id: 115, ok: "{{ 'hostbasedauthentication no' in (rhel_ssh_effective.stdout | lower) }}", descricao: "HostbasedAuth off" }
    - { id: 117, ok: "{{ 'permitemptypasswords no' in (rhel_ssh_effective.stdout | lower) }}", descricao: "EmptyPasswords off" }
    - { id: 118, ok: "{{ 'permituserenvironment no' in (rhel_ssh_effective.stdout | lower) }}", descricao: "UserEnvironment off" }
    - { id: 119, ok: "{{ 'usepam yes' in (rhel_ssh_effective.stdout | lower) }}", descricao: "UsePAM on" }
    - { id: 120, ok: "{{ (rhel_ssh_120.stdout | trim) == '1' }}", descricao: "ClientAlive tunado" }
    - { id: 121, ok: "{{ (rhel_ssh_121.stdout | trim) == '1' }}", descricao: "LoginGraceTime restrito" }
    - { id: 122, ok: "{{ (rhel_ssh_122.stdout | trim) == '1' }}", descricao: "MaxStartups restrito" }
    - { id: 123, ok: "{{ 'allowtcpforwarding no' in (rhel_ssh_effective.stdout | lower) or 'allowtcpforwarding local' in (rhel_ssh_effective.stdout | lower) }}", descricao: "AllowTcpForwarding restrito" }
    - { id: 125, ok: "{{ (rhel_ssh_125.stdout | trim) == '1' }}", descricao: "Ciphers fortes apenas" }
    - { id: 126, ok: "{{ (rhel_ssh_126.stdout | trim) == '1' }}", descricao: "MACs fortes apenas" }
    - { id: 127, ok: "{{ (rhel_ssh_127.stdout | trim) == '1' }}", descricao: "KexAlgorithms fortes apenas" }
    - { id: 128, ok: "{{ (rhel_ssh_128.stdout | trim) == '1' }}", descricao: "Preferencia por algoritmos modernos" }
    - { id: 129, ok: "{{ (rhel_ssh_forcecommand.stdout | trim) == '1' }}", descricao: "ForceCommand Chroot SSH" }
  loop_control:
    label: "{{ item.id }} - {{ item.descricao }}"

