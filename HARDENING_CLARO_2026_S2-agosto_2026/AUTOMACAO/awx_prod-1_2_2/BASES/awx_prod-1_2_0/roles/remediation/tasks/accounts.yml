- name: Pré-check timeout de shell (154)
  shell: |
    if [ -f /etc/profile.d/hitss-tmout.sh ]; then
      if grep -Eq '^[[:space:]]*TMOUT=900[[:space:]]*$' /etc/profile.d/hitss-tmout.sh && \
         grep -Eq '^[[:space:]]*export TMOUT[[:space:]]*$' /etc/profile.d/hitss-tmout.sh && \
         ! grep -Eq '^[[:space:]]*readonly TMOUT[[:space:]]*$' /etc/profile.d/hitss-tmout.sh; then
        echo "OK"
      else
        echo "NEEDS_CHANGE"
      fi
    else
      echo "NEEDS_CHANGE"
    fi
  register: remed_154_pre
  changed_when: false
  failed_when: false

- name: Remediar timeout de shell (154)
  shell: |
    printf '%s\n' 'TMOUT=900' 'export TMOUT' > /etc/profile.d/hitss-tmout.sh
    chown root:root /etc/profile.d/hitss-tmout.sh
    chmod 0644 /etc/profile.d/hitss-tmout.sh
    echo "CHANGED"
  register: remed_154_apply
  changed_when: remed_154_apply.stdout | trim == 'CHANGED'
  failed_when: false
