- name: Pré-check UID 0 exclusivo (148)
  shell: |
    if awk -F: '$3==0 {print $1}' /etc/passwd | grep -qx 'root'; then
      if [ "$(awk -F: '$3==0 {print $1}' /etc/passwd | wc -l)" -eq 1 ]; then
        echo "OK"
      else
        echo "MANUAL"
      fi
    else
      echo "MANUAL"
    fi
  register: remed_148
  changed_when: false
  failed_when: false

- name: Resultado UID 0 exclusivo (148)
  ansible.builtin.debug:
    msg: >-
      [HITSS][REMEDIATION][148] {{ remed_148.stdout | trim }}

