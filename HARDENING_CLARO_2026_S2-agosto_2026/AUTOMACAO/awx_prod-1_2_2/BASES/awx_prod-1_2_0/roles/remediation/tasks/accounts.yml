- name: Pré-check contas de sistema bloqueadas (150)
  shell: |
    if awk -F: '$3 < 1000 && $1 != "root" && $7 !~ /(nologin|false)$/ {print $1}' /etc/passwd | grep -q .; then
      echo "NEEDS_CHANGE"
    else
      echo "OK"
    fi
  register: remed_150_pre
  changed_when: false
  failed_when: false

- name: Remediar contas de sistema bloqueadas (150)
  shell: |
    if [ -x /sbin/nologin ]; then
      shell_path="/sbin/nologin"
    else
      if [ -x /usr/sbin/nologin ]; then
        shell_path="/usr/sbin/nologin"
      else
        if [ -x /bin/false ]; then
          shell_path="/bin/false"
        else
          shell_path=""
        fi
      fi
    fi

    if [ -z "$shell_path" ]; then
      echo "FALHA"
    else
      awk -F: '$3 < 1000 && $1 != "root" && $7 !~ /(nologin|false)$/ {print $1}' /etc/passwd > /tmp/hitss_150_users.txt

      if [ -s /tmp/hitss_150_users.txt ]; then
        if usermod -s "$shell_path" "$(head -n 1 /tmp/hitss_150_users.txt)" 2>/dev/null; then
          if [ "$(wc -l < /tmp/hitss_150_users.txt)" -eq 1 ]; then
            rm -f /tmp/hitss_150_users.txt
            echo "CHANGED"
          else
            echo "FALHA"
          fi
        else
          rm -f /tmp/hitss_150_users.txt
          echo "FALHA"
        fi
      else
        rm -f /tmp/hitss_150_users.txt
        echo "FALHA"
      fi
    fi
  register: remed_150_apply
  changed_when: remed_150_apply.stdout | trim == 'CHANGED'
  failed_when: false
  when: remed_150_pre.stdout | trim == 'NEEDS_CHANGE'

- name: Pós-check contas de sistema bloqueadas (150)
  shell: |
    if awk -F: '$3 < 1000 && $1 != "root" && $7 !~ /(nologin|false)$/ {print $1}' /etc/passwd | grep -q .; then
      echo "FALHA"
    else
      if [ "{{ remed_150_pre.stdout | trim }}" = "OK" ]; then
        echo "OK"
      else
        if [ "{{ remed_150_apply.stdout | default('') | trim }}" = "CHANGED" ]; then
          echo "CHANGED"
        else
          echo "FALHA"
        fi
      fi
    fi
  register: remed_150
  changed_when: false
  failed_when: false

- name: Resultado contas de sistema bloqueadas (150)
  ansible.builtin.debug:
    msg: >-
      [HITSS][REMEDIATION][150] {{ remed_150.stdout | trim }}

- name: Pré-check shells válidos (151)
  shell: |
    if awk -F: '{print $7}' /etc/passwd | while read -r shell; do
      grep -qx "$shell" /etc/shells || echo "$shell"
    done | grep -q .; then
      echo "NEEDS_CHANGE"
    else
      echo "OK"
    fi
  register: remed_151_pre
  changed_when: false
  failed_when: false

- name: Remediar shells válidos (151)
  shell: |
    if grep -qx '/sbin/nologin' /etc/shells; then
      echo "CHANGED"
    else
      if [ -x /sbin/nologin ]; then
        printf '%s\n' '/sbin/nologin' >> /etc/shells
        echo "CHANGED"
      else
        if grep -qx '/usr/sbin/nologin' /etc/shells; then
          echo "CHANGED"
        else
          if [ -x /usr/sbin/nologin ]; then
            printf '%s\n' '/usr/sbin/nologin' >> /etc/shells
            echo "CHANGED"
          else
            if grep -qx '/bin/false' /etc/shells; then
              echo "CHANGED"
            else
              if [ -x /bin/false ]; then
                printf '%s\n' '/bin/false' >> /etc/shells
                echo "CHANGED"
              else
                echo "FALHA"
              fi
            fi
          fi
        fi
      fi
    fi
  register: remed_151_apply
  changed_when: remed_151_pre.stdout | trim == 'NEEDS_CHANGE' and remed_151_apply.stdout | trim == 'CHANGED'
  failed_when: false
  when: remed_151_pre.stdout | trim == 'NEEDS_CHANGE'

- name: Pós-check shells válidos (151)
  shell: |
    if awk -F: '{print $7}' /etc/passwd | while read -r shell; do
      grep -qx "$shell" /etc/shells || echo "$shell"
