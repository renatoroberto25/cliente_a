    msg: >-
      [HITSS][REMEDIATION][152] {{ remed_152.stdout | trim }}

- name: Pré-check umask restritiva (153)
  shell: |
    if grep -R "umask" /etc/profile /etc/bashrc /etc/profile.d 2>/dev/null | grep -E '0(2|7)7' >/dev/null 2>&1; then
      echo "OK"
    else
      echo "NEEDS_CHANGE"
    fi
  register: remed_153_pre
  changed_when: false
  failed_when: false

- name: Remediar umask restritiva (153)
  shell: |
    if [ -f /etc/profile.d/hitss-umask.sh ]; then
      if grep -Eq '^\s*umask\s+027\s*$' /etc/profile.d/hitss-umask.sh; then
        echo "FALHA"
      else
        printf '%s\n' 'umask 027' > /etc/profile.d/hitss-umask.sh
        chmod 0644 /etc/profile.d/hitss-umask.sh
        echo "CHANGED"
      fi
    else
      printf '%s\n' 'umask 027' > /etc/profile.d/hitss-umask.sh
      chmod 0644 /etc/profile.d/hitss-umask.sh
      echo "CHANGED"
    fi
  register: remed_153_apply
  changed_when: remed_153_apply.stdout | trim == 'CHANGED'
  failed_when: false
  when: remed_153_pre.stdout | trim == 'NEEDS_CHANGE'

- name: Pós-check umask restritiva (153)
  shell: |
    if grep -R "umask" /etc/profile /etc/bashrc /etc/profile.d 2>/dev/null | grep -E '0(2|7)7' >/dev/null 2>&1; then
      if [ "{{ remed_153_pre.stdout | trim }}" = "OK" ]; then
        echo "OK"
      else
        if [ "{{ remed_153_apply.stdout | default('') | trim }}" = "CHANGED" ]; then
