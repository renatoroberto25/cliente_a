- name: Pré-check PATH do root seguro (152)
  shell: |
    if grep -R "^PATH=" /root /etc/profile /etc/bashrc /etc/profile.d 2>/dev/null | tr '=' '\n' | tr ':' '\n' | while read -r p; do [ "$p" = "." ] && echo "dot"; [ -d "$p" ] && test "$(stat -c %a "$p" 2>/dev/null | tail -c 1)" -ge 2 && echo "$p"; done | grep -q .; then
      echo "MANUAL"
    else
      echo "OK"
    fi
  register: remed_152
  changed_when: false
  failed_when: false

- name: Resultado PATH do root seguro (152)
