    descricao: "Verifique se o módulo do kernel do CRAMFS não está disponível"
    severidade: INFO
    comando: "(modinfo cramfs &>/dev/null && modprobe --showconfig | grep -Pq '\\b(install|blacklist)\\h+cramfs\\b' && ! lsmod | grep -q cramfs) || (! modinfo cramfs &>/dev/null) && echo \"PASS\" || echo \"FAIL\""
