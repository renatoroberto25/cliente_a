---
- name: "RHEL 05_legacy_software - aplicar conteúdo técnico vigente"
  ansible.builtin.shell: |
    set -u
    
    echo "[56-57] Remediacao: softwares legados"
    
    if [ "$(id -u)" -ne 0 ]; then
        echo "WARN: execute como root para avaliar remediacoes"
        exit 0
    fi
    
    pkg_installed() {
        rpm -q "$1" >/dev/null 2>&1
    }
    
    echo "[56] Prelink removido"
    if pkg_installed prelink; then
        echo "SKIP: prelink instalado; remocao ou desfazer prelink exige janela validada e aprovacao"
    else
        echo "OK: prelink nao instalado"
    fi
    
    echo "[57] xinetd removido"
    if pkg_installed xinetd; then
        echo "SKIP: xinetd instalado; remocao/desativacao pode afetar servicos legados e exige aprovacao"
    else
        echo "OK: xinetd nao instalado"
    fi
    
    echo "OK"
    exit 0
  args:
    executable: /bin/bash
  register: rhel_05_legacy_software_execucao
  changed_when: false
  failed_when: false

- name: "RHEL 05_legacy_software - registrar resultado do domínio"
  ansible.builtin.set_fact:
    resultado_controle:
      id: "05_legacy_software"
      severidade: "WARN"
      status: "{{ 'FAIL' if rhel_05_legacy_software_execucao.rc != 0 else ('MANUAL' if 'SKIP:' in rhel_05_legacy_software_execucao.stdout else 'CHANGED') }}"
      detalhe: "{{ rhel_05_legacy_software_execucao.stdout | default(rhel_05_legacy_software_execucao.stderr, true) | trim }}"
