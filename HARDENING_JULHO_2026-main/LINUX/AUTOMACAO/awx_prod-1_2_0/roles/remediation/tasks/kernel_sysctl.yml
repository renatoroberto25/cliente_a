- name: Carregar regras sysctl kernel
  ansible.builtin.include_vars:
    file: "{{ role_path }}/rules/kernel_sysctl.yml"

- name: Pré-check sysctl kernel
  command: sysctl -n {{ item.key }}
  register: remed_kernel_sysctl_pre
  loop: >-
    {{
      kernel_sysctl_rules
      | selectattr('key', 'defined')
      | rejectattr('key', 'none')
      | rejectattr('cmd', 'defined')
      | list
    }}
  loop_control:
    label: "{{ item.id }} - {{ item.descricao }}"
  changed_when: false
  failed_when: false

- name: Remediar sysctl fs.suid_dumpable
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/99-hitss-kernel.conf
    regexp: "^fs\\.suid_dumpable\\s*="
    line: "fs.suid_dumpable = 0"
    create: true
    owner: root
    group: root
    mode: "0644"
  register: remed_fs_suid_dumpable_file
  changed_when: remed_fs_suid_dumpable_file.changed
  when: >
    (
      remed_kernel_sysctl_pre.results
      | selectattr('item.key', 'equalto', 'fs.suid_dumpable')
      | map(attribute='stdout')
      | map('trim')
      | first
    ) != '0'

- name: Aplicar sysctl runtime fs.suid_dumpable
  command: sysctl -w fs.suid_dumpable=0
  register: remed_fs_suid_dumpable_runtime
  changed_when: remed_fs_suid_dumpable_runtime.rc == 0
  failed_when: false
  when: >
    (
      remed_kernel_sysctl_pre.results
      | selectattr('item.key', 'equalto', 'fs.suid_dumpable')
      | map(attribute='stdout')
      | map('trim')
      | first
    ) != '0'

