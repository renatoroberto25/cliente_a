- name: Pós-check sysctl kernel
  command: sysctl -n {{ item.key }}
  register: remed_kernel_sysctl_post
  loop: >-
    {{
      kernel_sysctl_rules
      | selectattr('key', 'defined')
      | rejectattr('key', 'none')
      | rejectattr('cmd', 'defined')
      | list
    }}
  loop_control:
    label: "{{ item.id }} - {{ item.descricao }}"
  changed_when: false
  failed_when: false

- name: Construir mapa sysctl pós-check
  ansible.builtin.set_fact:
    remed_kernel_sysctl_results: >-
      {{
        dict(
          remed_kernel_sysctl_post.results
          | map(attribute='item.key')
          | zip(
              remed_kernel_sysctl_post.results
              | map(attribute='stdout') | map('default', '') | map('trim')
            )
        )
      }}
  changed_when: false
  no_log: false

- name: Resultado remediação sysctl kernel
  ansible.builtin.debug:
    msg: >-
      [HITSS][REMEDIATION][{{ item.item.id }}]
      {{
        'OK'
        if (
          (item.item.expected is defined and (item.stdout | default('') | trim) == (item.item.expected | string))
          or
          (item.item.expected_min is defined and ((item.stdout | default('0') | trim | int) >= (item.item.expected_min | int)))
        )
        and
        (
          (
            item.item.expected is defined
            and
            (
              remed_kernel_sysctl_pre.results
              | selectattr('item.id', 'equalto', item.item.id)
              | map(attribute='stdout')
              | map('trim')
              | first
            ) == (item.item.expected | string)
          )
          or
          (
            item.item.id == 17
            and
            (
              remed_kernel_sysctl_pre.results
              | selectattr('item.key', 'equalto', 'kernel.randomize_va_space')
              | map(attribute='stdout')
              | map('trim')
              | first
              | int
            ) >= 1
          )
          or
          (
            item.item.id == 19
            and
            (
              remed_kernel_sysctl_pre.results
              | selectattr('item.key', 'equalto', 'kernel.perf_event_paranoid')
              | map(attribute='stdout')
              | map('trim')
              | first
              | int
            ) >= 2
          )
        )
        else
        (
          'CHANGED'
          if (
            (item.item.expected is defined and (item.stdout | default('') | trim) == (item.item.expected | string))
            or
            (item.item.expected_min is defined and ((item.stdout | default('0') | trim | int) >= (item.item.expected_min | int)))
          )
          else 'FALHA'
        )
      }}
  loop: "{{ remed_kernel_sysctl_post.results }}"
  loop_control:
    label: "{{ item.item.id }} - {{ item.item.descricao }}"

- name: Pré-check comandos kernel sem sysctl
  shell: "{{ item.cmd }}"
  register: remed_kernel_cmd_pre
  loop: "{{ kernel_sysctl_rules | selectattr('cmd', 'defined') | list }}"
  loop_control:
    label: "{{ item.id }} - {{ item.descricao }}"
  changed_when: false
  failed_when: false

- name: Resultado remediação comandos kernel
  ansible.builtin.debug:
    msg: >-
      [HITSS][REMEDIATION][{{ item.item.id }}]
      {{
        'OK'
        if item.rc == 0
        else 'MANUAL'
      }}
  loop: "{{ remed_kernel_cmd_pre.results }}"
  loop_control:
    label: "{{ item.item.id }} - {{ item.item.descricao }}"

- name: Resultado remediação protected links (22)
  ansible.builtin.debug:
    msg: >-
      [HITSS][REMEDIATION][22]
      {{
        'OK'
        if (
          remed_kernel_sysctl_results['fs.protected_symlinks'] | default('0') == '1'
          and
          remed_kernel_sysctl_results['fs.protected_hardlinks'] | default('0') == '1'
          and
          (
            remed_kernel_sysctl_pre.results
            | selectattr('item.key', 'equalto', 'fs.protected_symlinks')
            | map(attribute='stdout')
            | map('trim')
            | first
          ) == '1'
          and
          (
            remed_kernel_sysctl_pre.results
            | selectattr('item.key', 'equalto', 'fs.protected_hardlinks')
            | map(attribute='stdout')
            | map('trim')
            | first
          ) == '1'
        )
        else
        (
          'CHANGED'
          if (
            remed_kernel_sysctl_results['fs.protected_symlinks'] | default('0') == '1'
            and
            remed_kernel_sysctl_results['fs.protected_hardlinks'] | default('0') == '1'
          )
          else 'FALHA'
        )
      }}
