- name: Carregar regras network
  ansible.builtin.include_vars:
    file: "{{ role_path }}/rules/network.yml"

- name: Verificar IPv6 desabilitado (99)
  ansible.builtin.command: sysctl -n net.ipv6.conf.all.disable_ipv6
  register: ipv6_status
  changed_when: false
  failed_when: false

- name: Resultado IPv6 desabilitado (99)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][99]
      {{ 'APROVADO' if ipv6_status.stdout | trim == '1' else 'REPROVADO' }}

- name: Verificar Wireless/Bluetooth desabilitados (102)
  ansible.builtin.shell: lsmod | grep -Eq 'bluetooth|iwlwifi'
  register: wireless_status
  changed_when: false
  failed_when: false

- name: Resultado Wireless/Bluetooth desabilitados (102)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][102]
      {{ 'APROVADO' if wireless_status.rc != 0 else 'REPROVADO' }}
