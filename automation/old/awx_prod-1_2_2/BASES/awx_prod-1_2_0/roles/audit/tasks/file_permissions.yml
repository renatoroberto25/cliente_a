- name: Verificar home ausente (199)
  shell: |
    if awk -F: '($3>=1000 && $7!="/sbin/nologin" && $7!="/bin/false"){print $1":"$6}' /etc/passwd | while IFS=: read u d; do [ -d "$d" ] || echo "$u"; done | grep -q .; then
      echo "0"
    else
      echo "1"
    fi
  register: fp_199
  changed_when: false
  failed_when: false

- name: Resultado home ausente (199)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][199]
      {{ 'APROVADO' if fp_199.stdout | trim == '1' else 'REPROVADO' }}

