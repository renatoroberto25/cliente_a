- name: Verificar permissões passwd (185)
  shell: |
    if stat -c '%a' /etc/passwd 2>/dev/null | grep -Eq '^[0-6]44$'; then
      echo "1"
    else
      echo "0"
    fi
  register: fp_185
  changed_when: false
  failed_when: false

- name: Resultado permissões passwd (185)
  ansible.builtin.debug:
    msg: >-
      [HITSS][AUDIT][185]
      {{ 'APROVADO' if fp_185.stdout | trim == '1' else 'REPROVADO' }}

