---
- name: Auditoria HITSS RHEL
  hosts: all
  become: true
  gather_facts: true

  vars_files:
    - ../vars/hitss.yml

  pre_tasks:
    - name: Bloquear famílias diferentes de RedHat
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'RedHat'
          - ansible_facts.distribution_major_version | int in [7, 8, 9]
        fail_msg: "Sistema suportado: RHEL-like versões 7, 8 ou 9."

  roles:
    - common
    - audit
