- name: Pré-check permissões passwd- (186)
  shell: |
    if [ -e /etc/passwd- ]; then
      if stat -c '%a' /etc/passwd- 2>/dev/null | grep -Eq '^[0-6]44$'; then
        echo "OK"
      else
        echo "NEEDS_CHANGE"
      fi
    else
      echo "FALHA"
    fi
  register: remed_186_pre
  changed_when: false
  failed_when: false

- name: Remediar permissões passwd- (186)
  shell: |
    if chmod 0644 /etc/passwd- 2>/dev/null; then
      echo "CHANGED"
    else
      echo "FALHA"
    fi
  register: remed_186_apply
  changed_when: remed_186_apply.stdout | trim == 'CHANGED'
  failed_when: false
  when: remed_186_pre.stdout | trim == 'NEEDS_CHANGE'

- name: Pós-check permissões passwd- (186)
  shell: |
    if [ -e /etc/passwd- ]; then
      if stat -c '%a' /etc/passwd- 2>/dev/null | grep -Eq '^[0-6]44$'; then
        if [ "{{ remed_186_pre.stdout | trim }}" = "OK" ]; then
          echo "OK"
        else
          if [ "{{ remed_186_apply.stdout | default('') | trim }}" = "CHANGED" ]; then
            echo "CHANGED"
          else
            echo "FALHA"
          fi
        fi
      else
        echo "FALHA"
      fi
    else
      echo "FALHA"
    fi
  register: remed_186
  changed_when: false
  failed_when: false

- name: Resultado permissões passwd- (186)
  ansible.builtin.debug:
    msg: >-
      [HITSS][REMEDIATION][186] {{ remed_186.stdout | trim }}

